name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-24.04 # Playwright 1.59 has no Chromium build for ubuntu-latest (26.04)

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repo checks
        run: pnpm check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:smoke

      # TEMPORARY (PR #5): run the full e2e suite once so the non-smoke
      # Mermaid and wide-rail specs get a real-browser run. Remove before merge.
      - name: Run full e2e suite (temporary)
        run: pnpm test:e2e

      - name: Run coverage thresholds
        run: pnpm test:coverage
